<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZADDY Breadcrumbs 2026</title>
<style>
  :root {
    --bg: #0a0406; --panel: #12080c; --text: #ffd2dc;
    --red: #ff2ad4; --red-dim: #971a7a; --cyan: #00f3ff;
  }
  body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-bottom: 1px solid var(--red-dim);
  }
  .theme-switcher { display: flex; gap: 10px; }
  .theme-switcher button {
    background: transparent; border: 1px solid var(--red-dim); color: var(--red);
    padding: 4px 8px; cursor: pointer; font-family: monospace;
  }
  .theme-switcher button:hover { background: var(--red); color: var(--bg); }
  nav { width: 220px; padding: 10px; float: left; border-right: 1px solid var(--red-dim); height: calc(100vh - 50px); overflow: auto; }
  nav a { display: block; color: var(--red); text-decoration: none; padding: 4px 0; }
  nav a:hover { color: #fff; }
  main { margin-left: 240px; padding: 20px; }
  
  /* THEMES */
  .vibe-zaddy { --bg: #1a0f05; --panel: #2a1a0a; --text: #ffb347; --red: #ff4d1a; --cyan: #ff8c00; }
  .vibe-dab { --bg: #020d08; --panel: #071c10; --text: #9df5b7; --red: #ff3c78; --cyan: #39ff91; }
  .vibe-gdk { --bg: #050a14; --panel: #0a1428; --text: #a0c4ff; --red: #ff2b6a; --cyan: #4a90d9; }

  #audio-player { position: fixed; bottom: 10px; right: 10px; background: var(--panel); border: 1px solid var(--red); padding: 10px; display: none; }
  .play-btn { background: var(--red); color: var(--bg); border: none; padding: 4px 8px; cursor: pointer; font-family: monospace; }
  
  .yt-embed{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;max-width:100%;margin:12px 0;border:1px solid var(--red);background:#000}
  .yt-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
  <div>
    <a href="https://bkornpob.github.io/" style="color:var(--red);text-decoration:none;margin-right:20px;">multiverselib-collectives</a>
    ZADDY Breadcrumbs 2026
  </div>
  <div class="theme-switcher">
    <button onclick="setTheme('')">default</button>
    <button onclick="setTheme('vibe-zaddy')">ZADDY</button>
    <button onclick="setTheme('vibe-dab')">DAB</button>
    <button onclick="setTheme('vibe-gdk')">GDK</button>
  </div>
</header>
<nav id="toc"></nav>
<main id="content"></main>

<div id="audio-player">
  <div style="color:var(--red);margin-bottom:5px">now playing</div>
  <audio id="audio" controls style="width:300px"></audio>
  <button class="play-btn" onclick="document.getElementById('audio').pause(); document.getElementById('audio-player').style.display='none';">stop</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
function setTheme(t) { document.body.className = t; localStorage.setItem('theme', t); }
document.body.className = localStorage.getItem('theme') || '';

const pages = [
  {title:"page-0: cover", file:"page-0-coverimage.md"},
  {title:"page-1: vibe-check", file:"page-1-20250909-vibe-check.md"},
  {title:"page-2: professor-x-mode", file:"page-2-20251001-professor-x-mode.md"},
  {title:"page-3: exploit-gcm-tag-truncation", file:"page-3-20251206-exploit-gcm-tag-truncation.md"},
  {title:"page-4: batman-jailbreaks", file:"page-4-20260107-batman-jailbreaks.md"},
  {title:"page-5: echo-deep-seek-source", file:"page-5-20260118-echo-deep-seek-source.md"},
  {title:"page-6: omelette-symptom", file:"page-6-20260126-omelette-symptom.md"},
  {title:"page-7: break-jwt-secrets", file:"page-7-20260129-break-jwt-secrets.md"},
  {title:"page-8: goodboy-recon", file:"page-8-20260201-goodboy-recon.md"},
  {title:"page-9: jwt-betray", file:"page-9-20260205-jwt-betray.md"},
  {title:"page-10: necro-hum", file:"page-10-20260207-necro-hum.md"},
  {title:"page-11: xss-svg", file:"page-11-20260214-xss-svg.md"},
  {title:"page-12: judgement-day", file:"page-12-20260214-judgement-day.md"},
  {title:"page-13: bz-valentine-2026", file:"page-13-20260214-bz-valentine-2026.md"},
  {title:"page-14: sonata-botanical", file:"page-14-20260219-sonata-botanical.md"},
  {title:"page-15: companion-3", file:"page-15-20260219-companion-3.md"},
  {title:"page-16: protection-distortion", file:"page-16-20260226-protection-distortion.md"},
  {title:"page-17: bpj-toy", file:"page-17-20260301-bpj-toy.md"},
  {title:"page-18: seven-level-no-panic", file:"page-18-20260303-seven-level-no-panic.md"},
  {title:"page-19: letme-speak", file:"page-19-20260305-letme-speak.md"},
  {title:"page-20: lookback-2025", file:"page-20-20260429-lookback-2025.md"},
  {title:"page-21: jpf", file:"page-21-20260507-jpf.md"},
  {title:"page-22: seven-runes", file:"page-22-20260611-seven-runes.md"},
  {title:"page-23: spellbook-taw", file:"page-23-20260624-spellbook-taw.md"},
  {title:"page-24: spellbook-jailbreak", file:"page-24-20260729-spellbook-jailbreak.md"}
];

const toc = document.getElementById('toc');
pages.forEach((p,i)=>{
  const a = document.createElement('a');
  a.textContent = p.title;
  a.href = '#';
  a.onclick = (e) => { e.preventDefault(); loadPage(i); };
  toc.appendChild(a);
});

const audioPlayer = document.getElementById('audio-player');
const audio = document.getElementById('audio');

function playStory(src){
  audio.src = src;
  audioPlayer.style.display = 'block';
  audio.play();
}

function playYoutube(vid){
  const div = document.createElement('div');
  div.className = 'yt-embed';
  div.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  document.getElementById('content').appendChild(div);
}

function loadPage(i){
  fetch(pages[i].file).then(r=>r.text()).then(text=>{
    const content = document.getElementById('content');
    content.innerHTML = marked.parse(text);
    
    // Wire "play story" links
    content.querySelectorAll('a').forEach(a => {
        if (a.textContent.toLowerCase().includes('play story')) {
            a.onclick = (e) => {
                e.preventDefault();
                playStory(a.href);
            }
        }
    });
  });
}
loadPage(0);
</script>
</body>
</html>
